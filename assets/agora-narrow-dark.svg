<svg xmlns="http://www.w3.org/2000/svg" width="320" height="616" viewBox="0 0 320 616" fill="none" role="img" aria-labelledby="t d"><title id="t">AGORA AI — agent runtime for studying</title><desc id="d">AGORA AI. A team project — 10 contributors · 203 of 352 commits mine. A planner that reads 24 specialist descriptions instead of 143 tool schemas, then fans out. A radial diagram places the planner, aggregator and critic at the centre, fanning out to specialists including notes, flashcards, quiz, research, code, focus, media, voice. 143 agent tools, one registry, 24 specialists, ≤6 tools each, 467 of 490 routes behind auth, 664 test cases across the stack. Hard caps, asserted in code, not asked for in a prompt: re-plan 1 per task, critic ≤2 revisions, turn 120s soft budget. Built with FastAPI, MongoDB, Redis, React 19.</desc><style>
  @media (prefers-reduced-motion: reduce) { .orbit { display: none; } }
