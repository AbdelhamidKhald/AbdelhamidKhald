<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404" fill="none" role="img" aria-labelledby="t d"><title id="t">Student Information System — C++17</title><desc id="d">Student Information System, built with C++17, MySQL, WebView2, CMake. Layers: UI (14 HTML pages in a WebView2 shell); BINDINGS (52 native C++ ↔ JS bindings); DOMAIN (grades · attendance · fees · RBAC); DATA (MySQL · 23 tables · 34 foreign keys). 34 permissions across 4 roles — 42 of the 52 bindings gated, 36 explicit permission checks.</desc><style>
