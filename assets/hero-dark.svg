<svg xmlns="http://www.w3.org/2000/svg" width="820" height="372" viewBox="0 0 820 372" fill="none" role="img" aria-labelledby="t d"><title id="t">Abdelhamid Khald — Put the rules in the database, not the UI.</title><desc id="d">Abdelhamid Khald. C++, TypeScript, Python — the same answer every time. Put the rules in the database, not the UI. A diagram shows requests from C++, TypeScript and Python descending through interface and application layers and being authorized at the data layer.</desc><style>
