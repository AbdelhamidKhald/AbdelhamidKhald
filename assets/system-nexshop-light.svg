<svg xmlns="http://www.w3.org/2000/svg" width="820" height="404" viewBox="0 0 820 404" fill="none" role="img" aria-labelledby="t d"><title id="t">E-Commerce Platform — TypeScript</title><desc id="d">E-Commerce Platform, built with React 18, TypeScript, Supabase, PostgreSQL. Layers: UI (20 lazy route components · storefront + admin); CLIENT (3 contexts · 6 hooks · 39 query sites); POSTGREST (no server of my own); DATA (Postgres · 8 tables · 4 functions · 5 triggers). 31 Row Level Security policies — the client is never the security boundary.</desc><style>
